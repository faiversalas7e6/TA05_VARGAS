<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="../css/contacto.css">
    <link rel="icon" type="image/png" href="../imagen/favicon.png">
  </head>
  <body>
    <div class="contact-page">
      <!-- HEADER -->
      <header class="header">
        <a href="../index.html" class="header-logo">
          <div class="logo-icon">P</div>
          <span class="logo-text">My Portfolio</span>
        </a>
      </header>

      <!-- MAIN CONTENT -->
      <main class="contact-content">
        <div class="contact-intro">
          <h1>Contact Me</h1>
          <p>If you have any questions or would like to work with me, feel free to send me a message.</p>
        </div>

        <div class="contact-form-container">
          <h2>Contact Form</h2>
          <form action="#" method="POST">
            <div class="form-group">
              <label for="nombre">Name</label>
              <input type="text" id="nombre" name="nombre" placeholder="Your full name" required>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
              <label for="asunto">Subject</label>
              <input type="text" id="asunto" name="asunto" placeholder="Message subject" required>
            </div>

            <div class="form-group">
              <label for="mensaje">Message</label>
              <textarea id="mensaje" name="mensaje" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="form-submit">Send Message</button>
          </form>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <p>Copyright 2025 - All rights reserved</p>
      </footer>
    </div>
    <script src="../java/theme.js"></script>
    <script src="../java/idioma.js"></script>
  </body>
</html>
